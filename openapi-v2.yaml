# ─────────────────────────────────────────────
# COMPONENTS (Schemas, Parameters, Responses)
# ─────────────────────────────────────────────
components:

  # ── Parameters ──────────────────────────────
  parameters:
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-zA-Z0-9_-]+$"
      description: Course identifier
    PageId:
      name: pageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Page UUID
    ComponentId:
      name: componentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Component UUID
    ThemeId:
      name: themeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Theme UUID
    AudioId:
      name: audioId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Audio asset UUID
    PageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200

  # ── Responses ───────────────────────────────
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Resource conflict (duplicate ID)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

  # ── Schemas ─────────────────────────────────
  schemas:

    # ── Common ──────────────────────────
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: string

    ValidationErrorResponse:
      type: object
      required: [detail, errors]
      properties:
        detail:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    ValidationResult:
      type: object
      required: [valid]
      properties:
        valid:
          type: boolean
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        warnings:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    ReorderRequest:
      type: object
      required: [orderedIds]
      properties:
        orderedIds:
          type: array
          items:
            type: string
          description: IDs in desired order

    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
        environment:
          type: string
        timestamp:
          type: string
          format: date-time
        uptime:
          type: number

    # ── Audio ───────────────────────────
    AudioItem:
      type: object
      required: [audioUrl, triggerOn]
      properties:
        audioId:
          type: string
          format: uuid
          readOnly: true
        audioUrl:
          type: string
          description: URL to audio file from media upload
        triggerOn:
          type: string
          enum: [load, click, interaction]
        targetInteractionId:
          type: string
          nullable: true
          description: "Interaction point ID (e.g. 'tab-2', 'accordion-panel-1')"
        autoplay:
          type: boolean
          default: false
        requiredForCompletion:
          type: boolean
          default: false
        duration:
          type: number
          description: Duration in seconds
        label:
          type: string
          nullable: true
          description: Display name for narration list
        transcript:
          type: string
          nullable: true
          description: Text transcript for accessibility

    AudioConfig:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
        audioItems:
          type: array
          items:
            $ref: "#/components/schemas/AudioItem"
          default: []

    AudioAssetResponse:
      type: object
      properties:
        audioId:
          type: string
          format: uuid
        audioUrl:
          type: string
        duration:
          type: number
          nullable: true
        label:
          type: string
          nullable: true
        transcript:
          type: string
          nullable: true
        mimeType:
          type: string
        fileSize:
          type: integer
        courseId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    AudioMetadataUpdateRequest:
      type: object
      properties:
        label:
          type: string
        transcript:
          type: string
        duration:
          type: number
          description: Duration in seconds (if not auto-extracted)

    # ── Completion Criteria ─────────────
    CompletionCriteria:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [view, interact, audio, score, custom]
        threshold:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: Score threshold (for type=score)
        requiredInteractions:
          type: array
          items:
            type: string
          nullable: true
          description: Interaction IDs that must be performed
        requiredAudioIds:
          type: array
          items:
            type: string
          nullable: true
          description: Audio IDs that must be listened to

    # ── Component Styling ───────────────
    ComponentStyling:
      type: object
      properties:
        themeOverrides:
          $ref: "#/components/schemas/ThemeOverrides"
        layoutPosition:
          type: string
          nullable: true
          description: Grid area name from page layout

    # ── Component ───────────────────────
    ComponentCreateRequest:
      type: object
      required: [componentType, data]
      properties:
        componentType:
          type: string
          description: Must match a typeId from the Component Type Registry
        data:
          type: object
          description: Component-specific data validated against registry schema
        audioConfig:
          $ref: "#/components/schemas/AudioConfig"
        completionCriteria:
          $ref: "#/components/schemas/CompletionCriteria"
        styling:
          $ref: "#/components/schemas/ComponentStyling"

    ComponentUpdateRequest:
      type: object
      properties:
        data:
          type: object
        audioConfig:
          $ref: "#/components/schemas/AudioConfig"
        completionCriteria:
          $ref: "#/components/schemas/CompletionCriteria"
        styling:
          $ref: "#/components/schemas/ComponentStyling"

    ComponentResponse:
      type: object
      properties:
        componentId:
          type: string
          format: uuid
        componentType:
          type: string
        order:
          type: integer
        data:
          type: object
        audioConfig:
          $ref: "#/components/schemas/AudioConfig"
        completionCriteria:
          $ref: "#/components/schemas/CompletionCriteria"
        styling:
          $ref: "#/components/schemas/ComponentStyling"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Page Completion ─────────────────
    PageCompletionConfig:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
        strategy:
          type: string
          enum: [all, any, percentage, custom]
          default: all
        requiredComponents:
          type: array
          items:
            type: string
            format: uuid
          nullable: true
          description: Component IDs required (for strategy=custom)
        completionThreshold:
          type: number
          minimum: 0
          maximum: 100
          nullable: true
          description: Percentage threshold (for strategy=percentage)

    # ── Page Layout ─────────────────────
    ComponentPlacement:
      type: object
      properties:
        componentId:
          type: string
        gridArea:
          type: string
          description: CSS grid area name
        span:
          type: integer
          nullable: true
          description: Column span for preset layouts

    CustomGrid:
      type: object
      properties:
        columns:
          type: integer
          minimum: 1
          maximum: 4
        rows:
          type: string
          description: "CSS grid-template-rows (e.g. 'auto 1fr auto')"
        areas:
          type: array
          items:
            type: array
            items:
              type: string
          description: "CSS grid-template-areas"
        gap:
          type: string
          description: "CSS gap (e.g. '16px')"

    PageLayout:
      type: object
      properties:
        preset:
          type: string
          enum:
            - single-column
            - two-column
            - three-column
            - sidebar-left
            - sidebar-right
            - grid-2x2
            - hero-content
            - full-width
          nullable: true
        customGrid:
          $ref: "#/components/schemas/CustomGrid"
        spacing:
          type: string
          enum: [compact, normal, spacious]
          default: normal
        componentPlacements:
          type: array
          items:
            $ref: "#/components/schemas/ComponentPlacement"

    # ── Page Theme ──────────────────────
    PageThemeConfig:
      type: object
      properties:
        inheritCourse:
          type: boolean
          default: true
        overrides:
          $ref: "#/components/schemas/ThemeOverrides"

    # ── Page ────────────────────────────
    PageCreateRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentCreateRequest"
          description: Optional initial components
        pageCompletion:
          $ref: "#/components/schemas/PageCompletionConfig"
        layout:
          $ref: "#/components/schemas/PageLayout"
        theme:
          $ref: "#/components/schemas/PageThemeConfig"

    PageUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        pageCompletion:
          $ref: "#/components/schemas/PageCompletionConfig"
        layout:
          $ref: "#/components/schemas/PageLayout"
        theme:
          $ref: "#/components/schemas/PageThemeConfig"

    PageResponse:
      type: object
      properties:
        pageId:
          type: string
          format: uuid
        title:
          type: string
        order:
          type: integer
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentResponse"
        pageCompletion:
          $ref: "#/components/schemas/PageCompletionConfig"
        layout:
          $ref: "#/components/schemas/PageLayout"
        theme:
          $ref: "#/components/schemas/PageThemeConfig"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ── Course ──────────────────────────
    NavigationSettings:
      type: object
      properties:
        allowSkip:
          type: boolean
          default: true
        showProgress:
          type: boolean
          default: true
        linearProgression:
          type: boolean
          default: false

    CourseSettings:
      type: object
      properties:
        themeId:
          type: string
          format: uuid
          nullable: true
        autoplay:
          type: boolean
          default: false
        duration:
          type: number
          nullable: true
          description: Estimated duration in minutes

    CourseCreateRequest:
      type: object
      required: [courseId, title, author]
      properties:
        courseId:
          type: string
          pattern: "^[a-zA-Z0-9_-]+$"
          maxLength: 50
        title:
          type: string
          maxLength: 200
        author:
          type: string
          maxLength: 100
        language:
          type: string
          default: en
        description:
          type: string
          maxLength: 1000
          nullable: true
        version:
          type: string
          default: "1.0.0"
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PageCreateRequest"
          description: New format — pages with components
        templates:
          type: array
          items:
            type: object
          description: Legacy format — auto-converted to pages
        navigation:
          $ref: "#/components/schemas/NavigationSettings"
        settings:
          $ref: "#/components/schemas/CourseSettings"
        scoring:
          $ref: "#/components/schemas/ScoringConfig"

    CourseUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        author:
          type: string
          maxLength: 100
        language:
          type: string
        description:
          type: string
          maxLength: 1000
          nullable: true
        version:
          type: string
        navigation:
          $ref: "#/components/schemas/NavigationSettings"
        settings:
          $ref: "#/components/schemas/CourseSettings"
        scoring:
          $ref: "#/components/schemas/ScoringConfig"
        status:
          type: string
          enum: [draft, published, archived]

    CourseResponse:
      type: object
      properties:
        courseId:
          type: string
        title:
          type: string
        author:
          type: string
        language:
          type: string
        description:
          type: string
          nullable: true
        version:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PageResponse"
        navigation:
          $ref: "#/components/schemas/NavigationSettings"
        settings:
          $ref: "#/components/schemas/CourseSettings"
        scoring:
          $ref: "#/components/schemas/ScoringConfig"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CourseListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              courseId:
                type: string
              title:
                type: string
              author:
                type: string
              status:
                type: string
              pageCount:
                type: integer
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    CourseValidationRequest:
      type: object
      required: [course]
      properties:
        course:
          type: object
          description: Full course data to validate

    # ── Component Type Registry ─────────
    AudioSupportConfig:
      type: object
      properties:
        perComponent:
          type: boolean
          description: Can have component-level audio
        perInteraction:
          type: boolean
          description: Can have audio per tab/panel/item
        interactionPoints:
          type: array
          items:
            type: string
          nullable: true
          description: "Names of interaction points (e.g. ['tab', 'panel'])"

    ComponentTypeSummary:
      type: object
      properties:
        typeId:
          type: string
        category:
          type: string
        displayName:
          type: string
        description:
          type: string
        icon:
          type: string
        thumbnail:
          type: string
          nullable: true
        completionCapabilities:
          type: array
          items:
            type: string
            enum: [view, interact, audio, score]
        scoringEnabled:
          type: boolean
        audioSupport:
          $ref: "#/components/schemas/AudioSupportConfig"
        tags:
          type: array
          items:
            type: string
        estimatedDuration:
          type: number
          nullable: true

    ComponentTypeDetail:
      allOf:
        - $ref: "#/components/schemas/ComponentTypeSummary"
        - type: object
          properties:
            schemaVersion:
              type: string
              description: Schema version for cache invalidation
            etag:
              type: string
              description: ETag for conditional requests
            schema:
              type: object
              description: JSON Schema for validating component data
            defaultData:
              type: object
              description: Default data when component is first added
            defaultCompletionType:
              type: string
            maxScore:
              type: number
              nullable: true
            scoringRules:
              type: object
              nullable: true
              description: Per-quiz-type scoring configuration
            sortOrder:
              type: integer
            isActive:
              type: boolean
            createdAt:
              type: string
              format: date-time
            updatedAt:
              type: string
              format: date-time

    ComponentTypeListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ComponentTypeSummary"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        schemaVersion:
          type: string
          description: Schema version for cache invalidation

    CategorySummary:
      type: object
      properties:
        categoryId:
          type: string
        displayName:
          type: string
        description:
          type: string
        icon:
          type: string
        componentCount:
          type: integer
        sortOrder:
          type: integer

    CategoryListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategorySummary"

    # ── Theme ───────────────────────────
    ThemeColors:
      type: object
      properties:
        primary:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        secondary:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        background:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        surface:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        text:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        textSecondary:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        accent:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        error:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        success:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        warning:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        info:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        border:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"

    HeadingSizes:
      type: object
      properties:
        h1:
          type: number
        h2:
          type: number
        h3:
          type: number
        h4:
          type: number

    FontWeights:
      type: object
      properties:
        normal:
          type: number
        medium:
          type: number
        bold:
          type: number

    ThemeTypography:
      type: object
      properties:
        fontFamily:
          type: string
        headingFont:
          type: string
          nullable: true
        baseFontSize:
          type: number
        headingSizes:
          $ref: "#/components/schemas/HeadingSizes"
        lineHeight:
          type: number
        fontWeight:
          $ref: "#/components/schemas/FontWeights"

    ButtonStyle:
      type: object
      properties:
        borderRadius:
          type: number
        padding:
          type: string
        fontWeight:
          type: number
        textTransform:
          type: string
          enum: [none, uppercase, capitalize]

    CardStyle:
      type: object
      properties:
        borderRadius:
          type: number
        shadow:
          type: string
        borderWidth:
          type: number
        padding:
          type: string

    TabsStyle:
      type: object
      properties:
        style:
          type: string
          enum: [underline, pill, boxed]
        activeColor:
          type: string
          nullable: true
        borderRadius:
          type: number
          nullable: true

    AccordionStyle:
      type: object
      properties:
        style:
          type: string
          enum: [bordered, minimal, card]
        iconPosition:
          type: string
          enum: [left, right]
        spacing:
          type: number

    InputStyle:
      type: object
      properties:
        borderRadius:
          type: number
        borderColor:
          type: string
        focusColor:
          type: string

    ProgressBarStyle:
      type: object
      properties:
        height:
          type: number
        borderRadius:
          type: number
        fillColor:
          type: string
          nullable: true

    ThemeComponentStyles:
      type: object
      properties:
        button:
          $ref: "#/components/schemas/ButtonStyle"
        card:
          $ref: "#/components/schemas/CardStyle"
        tabs:
          $ref: "#/components/schemas/TabsStyle"
        accordion:
          $ref: "#/components/schemas/AccordionStyle"
        input:
          $ref: "#/components/schemas/InputStyle"
        progressBar:
          $ref: "#/components/schemas/ProgressBarStyle"

    ThemeOverrides:
      type: object
      description: Partial theme — any subset of properties can be overridden
      properties:
        colors:
          type: object
          additionalProperties:
            type: string
        typography:
          type: object
          additionalProperties: true
        componentStyles:
          type: object
          additionalProperties: true

    ThemeCreateRequest:
      type: object
      required: [name, colors, typography]
      properties:
        name:
          type: string
          maxLength: 200
        colors:
          $ref: "#/components/schemas/ThemeColors"
        typography:
          $ref: "#/components/schemas/ThemeTypography"
        componentStyles:
          $ref: "#/components/schemas/ThemeComponentStyles"

    ThemeUpdateRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        colors:
          $ref: "#/components/schemas/ThemeColors"
        typography:
          $ref: "#/components/schemas/ThemeTypography"
        componentStyles:
          $ref: "#/components/schemas/ThemeComponentStyles"

    ThemeResponse:
      type: object
      properties:
        themeId:
          type: string
          format: uuid
        name:
          type: string
        isPreset:
          type: boolean
        colors:
          $ref: "#/components/schemas/ThemeColors"
        typography:
          $ref: "#/components/schemas/ThemeTypography"
        componentStyles:
          $ref: "#/components/schemas/ThemeComponentStyles"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CourseThemeRequest:
      type: object
      properties:
        themeId:
          type: string
          format: uuid
          description: Set course theme by ID
        overrides:
          $ref: "#/components/schemas/ThemeOverrides"

    ResolvedThemeResponse:
      type: object
      properties:
        resolved:
          type: object
          description: Fully merged theme (course + overrides)
          properties:
            colors:
              $ref: "#/components/schemas/ThemeColors"
            typography:
              $ref: "#/components/schemas/ThemeTypography"
            componentStyles:
              $ref: "#/components/schemas/ThemeComponentStyles"
        inheritedFrom:
          type: string
          enum: [preset, course, page]
        overrides:
          $ref: "#/components/schemas/ThemeOverrides"
        courseThemeId:
          type: string
          format: uuid
          nullable: true
        courseThemeName:
          type: string
          nullable: true

    # ── Scoring ─────────────────────────
    ScormObjective:
      type: object
      properties:
        objectiveId:
          type: string
        componentIds:
          type: array
          items:
            type: string
          description: Components contributing to this objective
        description:
          type: string
        passingScore:
          type: number
          minimum: 0
          maximum: 100

    ScormReportingConfig:
      type: object
      properties:
        enabled:
          type: boolean
          default: true
        version:
          type: string
          enum: ["1.2", "2004"]
          default: "1.2"
        reportScore:
          type: boolean
          default: true
        reportCompletion:
          type: boolean
          default: true
        reportInteractions:
          type: boolean
          default: true
        objectives:
          type: array
          items:
            $ref: "#/components/schemas/ScormObjective"

    ComponentScoreConfig:
      type: object
      required: [componentId, maxPoints]
      properties:
        componentId:
          type: string
          format: uuid
        componentType:
          type: string
          description: Must be a scoringEnabled type
        weight:
          type: number
          minimum: 0
          maximum: 1
          description: Weight (sum must = 1.0 when weightedScoring=true)
        maxPoints:
          type: number
          minimum: 0

    ScoringConfig:
      type: object
      nullable: true
      properties:
        config:
          type: object
          properties:
            passingScore:
              type: number
              minimum: 0
              maximum: 100
              default: 70
            maxAttempts:
              type: integer
              nullable: true
              description: "null = unlimited"
            attemptScoring:
              type: string
              enum: [best, last, average]
              default: best
            showCorrectAnswers:
              type: boolean
              default: true
            showScoreAfterQuestion:
              type: boolean
              default: false
            showScoreAfterPage:
              type: boolean
              default: false
            weightedScoring:
              type: boolean
              default: false
            allowPartialCredit:
              type: boolean
              default: true
        componentScores:
          type: array
          items:
            $ref: "#/components/schemas/ComponentScoreConfig"
        scormReporting:
          $ref: "#/components/schemas/ScormReportingConfig"

    ScoringConfigResponse:
      allOf:
        - type: object
          properties:
            scoringId:
              type: string
              format: uuid
            courseId:
              type: string
        - $ref: "#/components/schemas/ScoringConfig"

    ScoringConfigUpdateRequest:
      $ref: "#/components/schemas/ScoringConfig"

    QuestionResponse:
      type: object
      properties:
        questionId:
          type: string
        selectedOptionIds:
          type: array
          items:
            type: string
          description: Selected option ID(s)

    ComponentAnswer:
      type: object
      required: [componentId, componentType, responses]
      properties:
        componentId:
          type: string
          format: uuid
        componentType:
          type: string
        responses:
          type: array
          items:
            $ref: "#/components/schemas/QuestionResponse"

    ScoreCalculateRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/ComponentAnswer"
        attemptNumber:
          type: integer
          default: 1

    QuestionResult:
      type: object
      properties:
        questionId:
          type: string
        correct:
          type: boolean
        score:
          type: number
        maxScore:
          type: number
        partialCredit:
          type: boolean
          default: false

    ComponentResult:
      type: object
      properties:
        componentId:
          type: string
        componentType:
          type: string
        score:
          type: number
        maxScore:
          type: number
        weight:
          type: number
        weightedScore:
          type: number
        questionResults:
          type: array
          items:
            $ref: "#/components/schemas/QuestionResult"

    ScoreCalculateResponse:
      type: object
      properties:
        totalScore:
          type: number
        maxScore:
          type: number
        percentage:
          type: number
        passed:
          type: boolean
        passingScore:
          type: number
        componentResults:
          type: array
          items:
            $ref: "#/components/schemas/ComponentResult"
        attemptNumber:
          type: integer
        remainingAttempts:
          type: integer
          nullable: true

    # ── Completion ──────────────────────
    ComponentCompletionStatus:
      type: object
      properties:
        componentId:
          type: string
        completed:
          type: boolean
        completionType:
          type: string
          enum: [view, interact, audio, score, custom]
        threshold:
          type: number
          nullable: true
        audioProgress:
          type: object
          nullable: true
          properties:
            listened:
              type: integer
            required:
              type: integer

    PageCompletionResponse:
      type: object
      properties:
        pageId:
          type: string
        title:
          type: string
        completed:
          type: boolean
        strategy:
          type: string
          enum: [all, any, percentage, custom]
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentCompletionStatus"

    CourseCompletionResponse:
      type: object
      properties:
        courseId:
          type: string
        status:
          type: string
          enum: [not-started, in-progress, completed, passed, failed]
        overallProgress:
          type: number
          description: Percentage 0-100
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PageCompletionResponse"

    PageCompletionEvent:
      type: object
      required: [componentStates]
      properties:
        componentStates:
          type: array
          description: Component completion states for this page
          items:
            type: object
            required: [componentId, completed]
            properties:
              componentId:
                type: string
              completed:
                type: boolean
              interactionsCompleted:
                type: array
                items:
                  type: string
                description: Interaction IDs completed within the component
              audiosCompleted:
                type: array
                items:
                  type: string
                description: Audio IDs completed within the component
              score:
                type: number
                nullable: true

    # ── Interaction Events ──────────────
    InteractionData:
      type: object
      properties:
        interactionId:
          type: string
          nullable: true
          description: "E.g. 'tab-2'"
        value:
          description: Response value (selected option ID, text input, etc.)
        score:
          type: number
          nullable: true
        maxScore:
          type: number
          nullable: true
        isCorrect:
          type: boolean
          nullable: true
        duration:
          type: number
          nullable: true
          description: Seconds spent

    InteractionEvent:
      type: object
      required: [pageId, componentId, interactionType]
      properties:
        pageId:
          type: string
        componentId:
          type: string
        interactionType:
          type: string
          description: Open string (e.g. flip, reveal, drag-sort, text-input, rating, acknowledge, download)
        data:
          $ref: "#/components/schemas/InteractionData"
        completed:
          type: boolean
          default: false

    InteractionEventResponse:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        courseId:
          type: string
        pageId:
          type: string
        componentId:
          type: string
        learnerId:
          type: string
        interactionType:
          type: string
        data:
          $ref: "#/components/schemas/InteractionData"
        score:
          type: number
          nullable: true
        maxScore:
          type: number
          nullable: true
        duration:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
        completed:
          type: boolean

    # ── Branching & Adaptive Navigation ─────
    BranchCondition:
      type: object
      required: [field, operator, value, targetPageId]
      properties:
        field:
          type: string
        operator:
          type: string
          description: Comparison operator (==, !=, >=, <=, >, <, in, contains)
        value:
          description: Value to compare against
        targetPageId:
          type: string

    BranchRule:
      type: object
      properties:
        branchId:
          type: string
        courseId:
          type: string
        title:
          type: string
