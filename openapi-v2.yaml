openapi: 3.1.0
info:
  title: eLearning Template Engine API
  description: |
    Backend API for the composable component-based eLearning authoring platform.
    Supports 89+ component types, per-interaction audio, page completion tracking,
    weighted scoring, full theming (layout + color system), and SCORM 1.2/2004 export.
  version: 2.0.0
  contact:
    name: eLearning Platform Team

servers:
  - url: /api/v1
    description: API v1 namespace

tags:
  - name: Health
    description: System health check
  - name: Courses
    description: Course CRUD and management
  - name: Pages
    description: Page CRUD within a course
  - name: Components
    description: Component CRUD within a page
  - name: ComponentRegistry
    description: Component type definitions and categories
  - name: Themes
    description: Theme CRUD and design system
  - name: Scoring
    description: Scoring configuration and calculation
  - name: Completion
    description: Completion tracking and status
  - name: Audio
    description: Audio asset management and narration
  - name: Export
    description: SCORM package export
  - name: Media
    description: General media upload and management
  - name: Branching
    description: Branching rules and adaptive navigation
  - name: Social
    description: Social and collaborative learning features
  - name: Analytics
    description: Course-level analytics and reporting

# ─────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────
paths:

  # ── Health ──────────────────────────────────
  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"

  # ── Courses ─────────────────────────────────
  /courses:
    get:
      tags: [Courses]
      operationId: listCourses
      summary: List all courses
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, archived]
      responses:
        "200":
          description: Paginated list of courses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseListResponse"
    post:
      tags: [Courses]
      operationId: createCourse
      summary: Create a course
      description: |
        Accepts both legacy `templates[]` format and new `pages[].components[]` format.
        Legacy format is auto-converted to pages+components internally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreateRequest"
      responses:
        "201":
          description: Course created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"

  /courses/validate:
    post:
      tags: [Courses]
      operationId: validateCourse
      summary: Validate course data
      description: Schema-driven validation via Component Type Registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseValidationRequest"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"

  /courses/{courseId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Courses]
      operationId: getCourse
      summary: Get a course by ID
      responses:
        "200":
          description: Course with pages and components
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Courses]
      operationId: updateCourse
      summary: Update course metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdateRequest"
      responses:
        "200":
          description: Updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Courses]
      operationId: deleteCourse
      summary: Delete a course
      responses:
        "204":
          description: Course deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Pages ───────────────────────────────────
  /courses/{courseId}/pages:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Pages]
      operationId: listPages
      summary: List all pages in a course (ordered)
      responses:
        "200":
          description: Ordered list of pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Pages]
      operationId: createPage
      summary: Create a page (with optional components)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageCreateRequest"
      responses:
        "201":
          description: Page created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /courses/{courseId}/pages/reorder:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      tags: [Pages]
      operationId: reorderPages
      summary: Reorder pages within a course
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRequest"
      responses:
        "200":
          description: Pages reordered
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /courses/{courseId}/pages/{pageId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [Pages]
      operationId: getPage
      summary: Get a page with its components
      responses:
        "200":
          description: Page with components
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Pages]
      operationId: updatePage
      summary: Update page metadata, layout, or theme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageUpdateRequest"
      responses:
        "200":
          description: Updated page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Pages]
      operationId: deletePage
      summary: Delete a page and its components
      responses:
        "204":
          description: Page deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Page Components ─────────────────────────
  /courses/{courseId}/pages/{pageId}/components:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [Components]
      operationId: listPageComponents
      summary: List components on a page (ordered)
      responses:
        "200":
          description: Ordered list of components
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComponentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Components]
      operationId: addComponent
      summary: Add a component to a page
      description: |
        Component `data` is validated against the JSON Schema from the Component Type Registry
        for the given `componentType`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentCreateRequest"
      responses:
        "201":
          description: Component created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /courses/{courseId}/pages/{pageId}/components/reorder:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/PageId"
    post:
      tags: [Components]
      operationId: reorderComponents
      summary: Reorder components on a page
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderRequest"
      responses:
        "200":
          description: Components reordered
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComponentResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /courses/{courseId}/pages/{pageId}/components/{componentId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/PageId"
      - $ref: "#/components/parameters/ComponentId"
    get:
      tags: [Components]
      operationId: getComponent
      summary: Get a single component
      responses:
        "200":
          description: Component detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Components]
      operationId: updateComponent
      summary: Update a component
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentUpdateRequest"
      responses:
        "200":
          description: Updated component
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      tags: [Components]
      operationId: deleteComponent
      summary: Remove a component from a page
      responses:
        "204":
          description: Component deleted
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Component Registry ──────────────────────
  /components:
    get:
      tags: [ComponentRegistry]
      operationId: listComponentTypes
      summary: List all component types
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Filter by category ID
        - name: scoringEnabled
          in: query
          schema:
            type: boolean
          description: Filter scorable types only
        - name: isActive
          in: query
          schema:
            type: boolean
            default: true
          description: Include inactive types
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Paginated component type list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentTypeListResponse"

  /components/categories:
    get:
      tags: [ComponentRegistry]
      operationId: listComponentCategories
      summary: List all component categories with counts
      responses:
        "200":
          description: Category list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"

  /components/categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [ComponentRegistry]
      operationId: listCategoryComponents
      summary: List component types in a category
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Component types in this category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentTypeListResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /components/search:
    get:
      tags: [ComponentRegistry]
      operationId: searchComponentTypes
      summary: Search component types by query/tags
      parameters:
        - name: q
          in: query
          schema:
            type: string
          description: Search query (matches displayName, description, tags)
        - name: category
          in: query
          schema:
            type: string
        - name: tags
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
          description: Comma-separated tags
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentTypeListResponse"

  /components/{typeId}:
    parameters:
      - name: typeId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [ComponentRegistry]
      operationId: getComponentType
      summary: Get a component type definition
      description: Returns full definition including JSON Schema, default data, scoring rules
      responses:
        "200":
          description: Component type definition
          headers:
            ETag:
              schema:
                type: string
              description: Entity tag for conditional requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentTypeDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Themes ──────────────────────────────────
  /themes:
    get:
      tags: [Themes]
      operationId: listThemes
      summary: List all themes (presets + custom)
      parameters:
        - name: isPreset
          in: query
          schema:
            type: boolean
          description: Filter by preset/custom
      responses:
        "200":
          description: Theme list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ThemeResponse"
    post:
      tags: [Themes]
      operationId: createTheme
      summary: Create a custom theme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeCreateRequest"
      responses:
        "201":
          description: Theme created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /themes/presets:
    get:
      tags: [Themes]
      operationId: listPresetThemes
      summary: List built-in preset themes
      responses:
        "200":
          description: Preset themes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ThemeResponse"

  /themes/{themeId}:
    parameters:
      - $ref: "#/components/parameters/ThemeId"
    get:
      tags: [Themes]
      operationId: getTheme
      summary: Get theme details
      responses:
        "200":
          description: Theme detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Themes]
      operationId: updateTheme
      summary: Update a custom theme
      description: Preset themes cannot be updated
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeUpdateRequest"
      responses:
        "200":
          description: Updated theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeResponse"
        "403":
          description: Cannot modify preset themes
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Themes]
      operationId: deleteTheme
      summary: Delete a custom theme
      description: Preset themes cannot be deleted
      responses:
        "204":
          description: Theme deleted
        "403":
          description: Cannot delete preset themes
        "404":
          $ref: "#/components/responses/NotFound"

  /courses/{courseId}/theme:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Themes]
      operationId: getCourseTheme
      summary: Get resolved course theme
      responses:
        "200":
          description: Resolved theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedThemeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Themes]
      operationId: setCourseTheme
      summary: Set course theme or overrides
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseThemeRequest"
      responses:
        "200":
          description: Updated resolved theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedThemeResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /courses/{courseId}/pages/{pageId}/theme:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [Themes]
      operationId: getPageTheme
      summary: Get resolved page theme (with course inheritance)
      responses:
        "200":
          description: Resolved page theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedThemeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Themes]
      operationId: setPageTheme
      summary: Set page theme overrides
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeOverrides"
      responses:
        "200":
          description: Updated resolved page theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedThemeResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Scoring ─────────────────────────────────
  /courses/{courseId}/scoring:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Scoring]
      operationId: getScoringConfig
      summary: Get scoring configuration
      responses:
        "200":
          description: Scoring configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoringConfigResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Scoring]
      operationId: updateScoringConfig
      summary: Update scoring configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoringConfigUpdateRequest"
      responses:
        "200":
          description: Updated scoring config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoringConfigResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /courses/{courseId}/scoring/validate:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      tags: [Scoring]
      operationId: validateScoringConfig
      summary: Validate scoring configuration
      description: Checks weights sum to 1.0, components are scorable, etc.
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ValidationResult"
        "404":
          $ref: "#/components/responses/NotFound"

  /courses/{courseId}/scoring/calculate:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    post:
      tags: [Scoring]
      operationId: calculateScore
      summary: Calculate score from submitted answers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreCalculateRequest"
      responses:
        "200":
          description: Score calculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreCalculateResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ── Completion ──────────────────────────────
  /courses/{courseId}/completion:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Completion]
      operationId: getCourseCompletion
      summary: Get course completion status
      responses:
        "200":
          description: Course completion breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseCompletionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /courses/{courseId}/pages/{pageId}/completion:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/PageId"
    get:
      tags: [Completion]
      operationId: getPageCompletion
      summary: Get page completion status
      responses:
        "200":
          description: Page completion breakdown
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageCompletionResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Completion]
      operationId: recordPageCompletion
      summary: Record page completion event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageCompletionEvent"
      responses:
        "200":
          description: Recorded completion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageCompletionResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /courses/{courseId}/interactions:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Completion]
      operationId: listInteractions
      summary: List recorded interaction events
      parameters:
        - name: learnerId
          in: query
          schema:
            type: string
          description: Filter by learner ID
        - name: interactionType
          in: query
          schema:
            type: string
          description: Filter by interaction type
        - name: pageId
          in: query
          schema:
            type: string
          description: Filter by page ID
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of interaction events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InteractionEventResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Completion]
      operationId: recordInteraction
      summary: Record a component interaction event
      description: |
        Used in preview mode and non-SCORM deployments.
        For SCORM exports, tracking happens client-side via cmi.interactions.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionEvent"
      responses:
        "201":
          description: Interaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionEventResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  # ── Branching & Adaptive Navigation ─────
  /courses/{courseId}/branches:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags: [Branching]
      operationId: listBranchRules
      summary: List branching rules for a course
      responses:
        "200":
          description: List of branching rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BranchRule"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Branching]
      operationId: createBranchRule
      summary: Create a branching rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRuleCreate"
      responses:
        "201":
          description: Branch rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchRule"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"

  /courses/{courseId}/branches/{branchId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - name: branchId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Branching]
      operationId: getBranchRule
      summary: Get a branching rule
      responses:
        "200":
          description: Branch rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchRule"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Branching]
      operationId: updateBranchRule
      summary: Update a branching rule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRuleUpdate"
