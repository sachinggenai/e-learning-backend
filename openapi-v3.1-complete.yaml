      responses:
        "200":
          description: List of media files
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaFileInfo"

components:
  schemas:
    # ══════════════════════════════════════════════════════════════════
    # HEALTH
    # ══════════════════════════════════════════════════════════════════

    HealthCheckResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, unhealthy]
        version:
          type: string
        timestamp:
          type: string
          format: date-time

    # ══════════════════════════════════════════════════════════════════
    # COURSES, PAGES, COMPONENTS (from existing spec)
    # ══════════════════════════════════════════════════════════════════

    CourseResponse:
      type: object
      properties:
        courseId:
          type: string
        title:
          type: string
        author:
          type: string
        language:
          type: string
        description:
          type: string
          nullable: true
        version:
          type: string
        status:
          type: string
          enum: [draft, published, archived]
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PageResponse"
        navigation:
          $ref: "#/components/schemas/NavigationSettings"
        settings:
          $ref: "#/components/schemas/CourseSettings"
        scoring:
          $ref: "#/components/schemas/ScoringConfig"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CourseCreateRequest:
      type: object
      required: [courseId, title, author]
      properties:
        courseId:
          type: string
          pattern: "^[a-zA-Z0-9_-]+$"
          maxLength: 50
        title:
          type: string
          maxLength: 200
        author:
          type: string
          maxLength: 100
        language:
          type: string
          default: en
        description:
          type: string
          maxLength: 1000
          nullable: true
        version:
          type: string
          default: "1.0.0"
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PageCreateRequest"
        navigation:
          $ref: "#/components/schemas/NavigationSettings"
        settings:
          $ref: "#/components/schemas/CourseSettings"
        scoring:
          $ref: "#/components/schemas/ScoringConfig"

    CourseUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        author:
          type: string
          maxLength: 100
        language:
          type: string
        description:
          type: string
          maxLength: 1000
          nullable: true
        version:
          type: string
        navigation:
          $ref: "#/components/schemas/NavigationSettings"
        settings:
          $ref: "#/components/schemas/CourseSettings"
        scoring:
          $ref: "#/components/schemas/ScoringConfig"
        status:
          type: string
          enum: [draft, published, archived]

    CourseListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              courseId:
                type: string
              title:
                type: string
              author:
                type: string
              status:
                type: string
              pageCount:
                type: integer
              createdAt:
                type: string
                format: date-time
              updatedAt:
                type: string
                format: date-time
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    CourseValidationRequest:
      type: object
      required: [course]
      properties:
        course:
          type: object

    NavigationSettings:
      type: object
      properties:
        allowSkip:
          type: boolean
          default: true
        showProgress:
          type: boolean
          default: true
        linearProgression:
          type: boolean
          default: false

    CourseSettings:
      type: object
      properties:
        themeId:
          type: string
          format: uuid
          nullable: true
        autoplay:
          type: boolean
          default: false
        duration:
          type: number
          nullable: true

    PageCreateRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
          maxLength: 200
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentCreateRequest"
        pageCompletion:
          type: object
        layout:
          type: object
        theme:
          type: object

    PageUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 200
        pageCompletion:
          type: object
        layout:
          type: object
        theme:
          type: object

    PageResponse:
      type: object
      properties:
        pageId:
          type: string
        title:
          type: string
        order:
          type: integer
        components:
          type: array
          items:
            $ref: "#/components/schemas/ComponentResponse"
        pageCompletion:
          type: object
        layout:
          type: object
        theme:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ComponentCreateRequest:
      type: object
      required: [componentType]
      properties:
        componentType:
          type: string
        data:
          type: object
          default: {}
        audioConfig:
          type: object
        completionCriteria:
          type: object
        styling:
          type: object

    ComponentUpdateRequest:
      type: object
      properties:
        data:
          type: object
        audioConfig:
          type: object
        completionCriteria:
          type: object
        styling:
          type: object

    ComponentResponse:
      type: object
      properties:
        componentId:
          type: string
        componentType:
          type: string
        order:
          type: integer
        data:
          type: object
        audioConfig:
          type: object
        completionCriteria:
          type: object
        styling:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ComponentTypeSummary:
      type: object
      properties:
        typeId:
          type: string
        category:
          type: string
        displayName:
          type: string
        description:
          type: string
        icon:
          type: string
        thumbnail:
          type: string
        completionCapabilities:
          type: array
          items:
            type: string
            enum: [view, interact, audio, score]
        scoringEnabled:
          type: boolean
        tags:
          type: array
          items:
            type: string

    ComponentTypeDetail:
      allOf:
        - $ref: "#/components/schemas/ComponentTypeSummary"
        - type: object
          properties:
            schemaVersion:
              type: string
            schema:
              type: object
            defaultData:
              type: object
            maxScore:
              type: number
              nullable: true

    ComponentTypeListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ComponentTypeSummary"
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    CategorySummary:
      type: object
      properties:
        categoryId:
          type: string
        displayName:
          type: string
        description:
          type: string
        icon:
          type: string
        componentCount:
          type: integer

    CategoryListResponse:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: "#/components/schemas/CategorySummary"

    # ══════════════════════════════════════════════════════════════════
    # THEMES
    # ══════════════════════════════════════════════════════════════════

    ThemeColors:
      type: object
      properties:
        primary:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        secondary:
          type: string
        background:
          type: string
        surface:
          type: string
        text:
          type: string
        accent:
          type: string
        error:
          type: string
        success:
          type: string
        warning:
          type: string

    ThemeTypography:
      type: object
      properties:
        fontFamily:
          type: string
        baseFontSize:
          type: number
        lineHeight:
          type: number

    ThemeCreateRequest:
      type: object
      required: [name, colors, typography]
      properties:
        name:
          type: string
          maxLength: 200
        colors:
          $ref: "#/components/schemas/ThemeColors"
        typography:
          $ref: "#/components/schemas/ThemeTypography"

    ThemeUpdateRequest:
      type: object
      properties:
        name:
          type: string
        colors:
          $ref: "#/components/schemas/ThemeColors"
        typography:
          $ref: "#/components/schemas/ThemeTypography"

    ThemeResponse:
      type: object
      properties:
        themeId:
          type: string
          format: uuid
        name:
          type: string
        isPreset:
          type: boolean
        colors:
          $ref: "#/components/schemas/ThemeColors"
        typography:
          $ref: "#/components/schemas/ThemeTypography"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CourseThemeRequest:
      type: object
      properties:
        themeId:
          type: string
          format: uuid
          nullable: true
        overrides:
          type: object

    ResolvedThemeResponse:
      type: object
      properties:
        resolved:
          $ref: "#/components/schemas/ThemeResponse"
        inheritedFrom:
          type: string
          enum: [preset, course, page]
        overrides:
          type: object
        courseThemeId:
          type: string
          nullable: true

    # ══════════════════════════════════════════════════════════════════
    # SCORING & COMPLETION
    # ══════════════════════════════════════════════════════════════════

    ScoringConfig:
      type: object
      nullable: true
      properties:
        config:
          type: object
          properties:
            passingScore:
              type: number
              minimum: 0
              maximum: 100
            maxAttempts:
              type: integer
              nullable: true
            attemptScoring:
              type: string
              enum: [best, last, average]
              default: best
            showCorrectAnswers:
              type: boolean
            showScoreAfterQuestion:
              type: boolean
            showScoreAfterPage:
              type: boolean
            weightedScoring:
              type: boolean
            allowPartialCredit:
              type: boolean
        componentScores:
          type: array
          items:
            type: object
        scormReporting:
          type: object

    ScoringConfigResponse:
      type: object
      properties:
        scoringId:
          type: string
          format: uuid
        courseId:
          type: string
        config:
          type: object
        componentScores:
          type: array
          items:
            type: object

    ScoringConfigUpdateRequest:
      $ref: "#/components/schemas/ScoringConfig"

    ScoreCalculateRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: array
          items:
            type: object
        attemptNumber:
          type: integer
          default: 1

    ScoreCalculateResponse:
      type: object
      properties:
        totalScore:
          type: number
        maxScore:
          type: number
        percentage:
          type: number
        passed:
          type: boolean
        passingScore:
          type: number
        componentResults:
          type: array
          items:
            type: object
        attemptNumber:
          type: integer
        remainingAttempts:
          type: integer
          nullable: true

    PageCompletionEvent:
      type: object
      required: [componentStates]
      properties:
        componentStates:
          type: array
          items:
            type: object
            required: [componentId, completed]
            properties:
              componentId:
                type: string
              completed:
                type: boolean

    PageCompletionResponse:
      type: object
      properties:
        pageId:
          type: string
        title:
          type: string
        completed:
          type: boolean
        strategy:
          type: string
        components:
          type: array
          items:
            type: object

    CourseCompletionResponse:
      type: object
      properties:
        courseId:
          type: string
        status:
          type: string
          enum: [not-started, in-progress, completed, passed, failed]
        overallProgress:
          type: number
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PageCompletionResponse"

    InteractionEvent:
      type: object
      required: [pageId, componentId, interactionType]
      properties:
        pageId:
          type: string
        componentId:
          type: string
        interactionType:
          type: string
        data:
          type: object
        completed:
          type: boolean
          default: false

    InteractionEventResponse:
      type: object
      properties:
        eventId:
          type: string
          format: uuid
        courseId:
          type: string
        pageId:
          type: string
        componentId:
          type: string
        learnerId:
          type: string
        interactionType:
          type: string
        data:
          type: object
        score:
          type: number
          nullable: true
        maxScore:
          type: number
          nullable: true
        duration:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
        completed:
          type: boolean

    # ══════════════════════════════════════════════════════════════════
    # BRANCHING
    # ══════════════════════════════════════════════════════════════════

    BranchCondition:
      type: object
      required: [field, operator, value, targetPageId]
      properties:
        field:
          type: string
        operator:
          type: string
        value:
          type: string
        targetPageId:
          type: string

    BranchRule:
      type: object
      properties:
        branchId:
          type: string
        courseId:
          type: string
        title:
          type: string
        sourcePageId:
          type: string
          nullable: true
        sourceComponentId:
          type: string
          nullable: true
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/BranchCondition"
        defaultTargetPageId:
          type: string
          nullable: true
        priority:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    BranchRuleCreate:
      type: object
      properties:
        title:
          type: string
        sourcePageId:
          type: string
          nullable: true
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/BranchCondition"
        defaultTargetPageId:
          type: string
          nullable: true
        priority:
          type: integer
          default: 0
        isActive:
          type: boolean
          default: true

    BranchRuleUpdate:
      type: object
      properties:
        title:
          type: string
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/BranchCondition"
        priority:
          type: integer
        isActive:
          type: boolean

    BranchEvent:
      type: object
      properties:
        eventId:
          type: string
        branchId:
          type: string
        courseId:
          type: string
        learnerId:
          type: string
        targetPageId:
          type: string
        createdAt:
          type: string
          format: date-time

    BranchEventCreate:
      type: object
      required: [targetPageId]
      properties:
        learnerId:
          type: string
        targetPageId:
          type: string

    # ══════════════════════════════════════════════════════════════════
    # DISCUSSIONS
    # ══════════════════════════════════════════════════════════════════

    DiscussionThread:
      type: object
      properties:
        threadId:
          type: string
        courseId:
          type: string
        pageId:
          type: string
          nullable: true
        authorId:
          type: string
        title:
          type: string
        body:
          type: string
        isPinned:
          type: boolean
        isClosed:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DiscussionThreadCreate:
      type: object
      required: [title]
      properties:
        title:
          type: string
        body:
          type: string
        authorId:
          type: string
        pageId:
          type: string
          nullable: true

    DiscussionReply:
      type: object
      properties:
        replyId:
          type: string
        threadId:
          type: string
        authorId:
          type: string
        body:
          type: string
        parentReplyId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    DiscussionReplyCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
        authorId:
          type: string
        parentReplyId:
          type: string
          nullable: true

    DiscussionThreadWithReplies:
      allOf:
        - $ref: "#/components/schemas/DiscussionThread"
        - type: object
          properties:
            replies:
              type: array
              items:
                $ref: "#/components/schemas/DiscussionReply"

    # ══════════════════════════════════════════════════════════════════
    # PEER REVIEWS
    # ══════════════════════════════════════════════════════════════════

    PeerReviewSubmission:
      type: object
      properties:
        submissionId:
          type: string
        courseId:
          type: string
        pageId:
          type: string
          nullable: true
        authorId:
          type: string
        content:
          type: object
        status:
          type: string
        createdAt:
          type: string
          format: date-time

    PeerReviewSubmissionCreate:
      type: object
      properties:
        content:
          type: object
        authorId:
          type: string
        pageId:
          type: string
          nullable: true

    PeerReview:
      type: object
      properties:
        reviewId:
          type: string
        submissionId:
          type: string
        reviewerId:
          type: string
        feedback:
          type: string
        rubricScores:
          type: object
          nullable: true
        overallScore:
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time

    PeerReviewCreate:
      type: object
      properties:
        reviewerId:
          type: string
        feedback:
          type: string
        rubricScores:
          type: object
        overallScore:
          type: number

    PeerReviewSubmissionWithReviews:
      allOf:
        - $ref: "#/components/schemas/PeerReviewSubmission"
        - type: object
          properties:
            reviews:
              type: array
              items:
                $ref: "#/components/schemas/PeerReview"

    # ══════════════════════════════════════════════════════════════════
    # POLLS
    # ══════════════════════════════════════════════════════════════════

    PollOption:
      type: object
      properties:
        index:
          type: integer
        text:
          type: string

    Poll:
      type: object
      properties:
        pollId:
          type: string
        courseId:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/PollOption"
        allowMultiple:
          type: boolean
        isAnonymous:
          type: boolean
        isClosed:
          type: boolean
        createdAt:
          type: string
          format: date-time

    PollCreate:
      type: object
      required: [question, options]
      properties:
        question:
          type: string
        options:
          type: array
          items:
            type: string
        allowMultiple:
          type: boolean
        isAnonymous:
          type: boolean

    PollVote:
      type: object
      properties:
        voteId:
          type: string
        pollId:
          type: string
        voterId:
          type: string
        selectedOptions:
          type: array
          items:
            type: integer
        createdAt:
          type: string
          format: date-time

    PollVoteCreate:
      type: object
      required: [selectedOptions]
      properties:
        voterId:
          type: string
        selectedOptions:
          type: array
          items:
            type: integer

    PollResultOption:
      type: object
      properties:
        index:
          type: integer
        text:
          type: string
        votes:
          type: integer
        percentage:
          type: number

    PollResults:
      type: object
      properties:
        pollId:
          type: string
        question:
          type: string
        totalVotes:
          type: integer
        options:
          type: array
          items:
            $ref: "#/components/schemas/PollResultOption"

    # ══════════════════════════════════════════════════════════════════
    # TEAMS
    # ══════════════════════════════════════════════════════════════════

    Team:
      type: object
      properties:
        teamId:
          type: string
        courseId:
          type: string
        name:
          type: string
        members:
          type: array
          items:
            type: string
        score:
          type: number
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time

    TeamCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        members:
          type: array
          items:
            type: string
        metadata:
          type: object

    TeamUpdate:
      type: object
      properties:
        name:
          type: string
        members:
          type: array
          items:
            type: string
        score:
          type: number
        metadata:
          type: object

    # ══════════════════════════════════════════════════════════════════
    # ANALYTICS
    # ══════════════════════════════════════════════════════════════════

    AnalyticsSummary:
      type: object
      properties:
        courseId:
          type: string
        title:
          type: string
        structure:
          type: object
          properties:
            totalPages:
              type: integer
            totalComponents:
              type: integer
            scoringComponents:
              type: integer
        scoring:
          type: object
        interactions:
          type: object
        generatedAt:
          type: string
          format: date-time

    AnalyticsSkill:
      type: object
      properties:
        skill:
          type: string
        componentCount:
          type: integer
        components:
          type: array
          items:
            type: object

    AnalyticsSkills:
      type: object
      properties:
        courseId:
          type: string
        skills:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsSkill"
        totalSkills:
          type: integer
        generatedAt:
          type: string
          format: date-time

    AnalyticsManagerPage:
      type: object
      properties:
        pageId:
          type: string
        title:
          type: string
        order:
          type: integer
        componentCount:
          type: integer

    AnalyticsManagerView:
      type: object
      properties:
        courseId:
          type: string
        courseTitle:
          type: string
        pages:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsManagerPage"
        totalPages:
          type: integer
        generatedAt:
          type: string
          format: date-time

    # ══════════════════════════════════════════════════════════════════
    # AUDIO
    # ══════════════════════════════════════════════════════════════════

    PageNarrationInfo:
      type: object
      properties:
        pageId:
          type: string
        pageTitle:
          type: string
        audioItems:
          type: array
          items:
            type: object

    CourseNarrationResponse:
      type: object
      properties:
        courseId:
          type: string
        totalAudioItems:
          type: integer
        totalDuration:
          type: number
        pages:
          type: array
          items:
            $ref: "#/components/schemas/PageNarrationInfo"

    # ══════════════════════════════════════════════════════════════════
    # EXPORT & MEDIA
    # ══════════════════════════════════════════════════════════════════

    ExportRequest:
      type: object
      required: [course]
      properties:
        course:
          type: string

    ExportFormatsResponse:
      type: object
      properties:
        formats:
          type: array
          items:
            type: object

    ExportStatusResponse:
      type: object
      properties:
        exportId:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed]
        progress:
          type: number
        downloadUrl:
          type: string
          nullable: true

    MediaUploadResponse:
      type: object
      properties:
        fileId:
          type: string
        fileName:
          type: string
        filePath:
          type: string
        fileUrl:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer
        category:
          type: string

    MediaFileInfo:
      type: object
      properties:
        fileId:
          type: string
        fileName:
          type: string
        filePath:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer
        category:
