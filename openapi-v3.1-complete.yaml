openapi: 3.1.0
info:
  title: eLearning Template Engine API
  description: |
    Backend API for the composable component-based eLearning authoring platform.
    Supports 89+ component types, per-interaction audio, page completion tracking,
    weighted scoring, full theming (layout + color system), and SCORM 1.2/2004 export.

    **Recently Added Features:**
    - Page & Component CRUD (new architecture)
    - Scoring & Completion tracking
    - Social/Collaborative features (discussions, peer reviews, polls, teams)
    - Branching & Adaptive navigation
    - Audio management and narration
    - Analytics & reporting
    - SCORM import/migration
  version: 3.1.0
  contact:
    name: eLearning Platform Team
  license:
    name: Proprietary

servers:
  - url: /api/v1
    description: API v1 namespace

tags:
  - name: Health
    description: System health and readiness checks
  - name: Courses
    description: Course CRUD and management
  - name: Pages
    description: Page CRUD within a course
  - name: Components
    description: Component CRUD within a page
  - name: ComponentRegistry
    description: Component type definitions and categories
  - name: Themes
    description: Theme CRUD and design system
  - name: Scoring
    description: Scoring configuration and calculation
  - name: Completion
    description: Completion tracking and status
  - name: Audio
    description: Audio asset management and narration
  - name: Export
    description: SCORM package export and validation
  - name: Import
    description: SCORM package import and migration
  - name: Media
    description: Media upload and file management
  - name: Branching
    description: Branching rules and adaptive navigation
  - name: Discussions
    description: Discussion threads and replies
  - name: PeerReview
    description: Peer review submissions and feedback
  - name: Polls
    description: Polls and voting
  - name: Teams
    description: Team management and collaboration
  - name: Analytics
    description: Course-level analytics and reporting

paths:

  # ──────────────────────────────────────────
  # HEALTH & STATUS
  # ──────────────────────────────────────────

  /health:
    get:
      tags: [Health]
      operationId: healthCheck
      summary: Basic health check
      description: Returns basic service status (healthy/unhealthy)
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheckResponse"
        "503":
          description: Service is unhealthy

  /health/detailed:
    get:
      tags: [Health]
      operationId: healthCheckDetailed
      summary: Detailed health check
      description: Returns detailed health status including database and dependencies
      responses:
        "200":
          description: Detailed health status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  database:
                    type: string
                  components:
                    type: object

  /health/ready:
    get:
      tags: [Health]
      operationId: readinessCheck
      summary: Readiness check (Kubernetes-compatible)
      description: Returns 200 when ready to handle requests, 503 otherwise
      responses:
        "200":
          description: Service is ready
        "503":
          description: Service is not ready

  /health/live:
    get:
      tags: [Health]
      operationId: livenessCheck
      summary: Liveness check (Kubernetes-compatible)
      description: Returns 200 when service is running
      responses:
        "200":
          description: Service is alive

  # ──────────────────────────────────────────
  # COURSES
  # ──────────────────────────────────────────

  /courses:
    get:
      tags: [Courses]
      operationId: listCourses
      summary: List all courses
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, published, archived]
      responses:
        "200":
          description: Paginated list of courses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseListResponse"

    post:
      tags: [Courses]
      operationId: createCourse
      summary: Create a new course
      description: |
        Accept both legacy `templates[]` format and new `pages[].components[]` format.
        Legacy format is auto-converted to pages+components internally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseCreateRequest"
      responses:
        "201":
          description: Course created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "400":
          description: Invalid request data
        "409":
          description: Course ID already exists

  /courses/{courseId}:
    get:
      tags: [Courses]
      operationId: getCourse
      summary: Get course details
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Course details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "404":
          description: Course not found

    patch:
      tags: [Courses]
      operationId: updateCourse
      summary: Update course metadata
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpdateRequest"
      responses:
        "200":
          description: Course updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseResponse"
        "404":
          description: Course not found

    delete:
      tags: [Courses]
      operationId: deleteCourse
      summary: Delete a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Course deleted
        "404":
          description: Course not found

  /courses/{courseId}/pages:
    get:
      tags: [Pages]
      operationId: listPages
      summary: List all pages in a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of pages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageResponse"
        "404":
          description: Course not found

    post:
      tags: [Pages]
      operationId: createPage
      summary: Create a new page
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageCreateRequest"
      responses:
        "201":
          description: Page created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse"
        "404":
          description: Course not found
        "400":
          description: Invalid page data

  /courses/{courseId}/pages/reorder:
    post:
      tags: [Pages]
      operationId: reorderPages
      summary: Reorder pages in a course
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderedIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Pages reordered
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageResponse"
        "404":
          description: Course not found

  /courses/{courseId}/pages/{pageId}:
    get:
      tags: [Pages]
      operationId: getPage
      summary: Get page details
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Page details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse"
        "404":
          description: Page not found

    patch:
      tags: [Pages]
      operationId: updatePage
      summary: Update page metadata
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageUpdateRequest"
      responses:
        "200":
          description: Page updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse"
        "404":
          description: Page not found

    delete:
      tags: [Pages]
      operationId: deletePage
      summary: Delete a page
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Page deleted
        "404":
          description: Page not found

  /courses/{courseId}/pages/{pageId}/components:
    get:
      tags: [Components]
      operationId: listComponents
      summary: List components on a page
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of components
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComponentResponse"
        "404":
          description: Page not found

    post:
      tags: [Components]
      operationId: createComponent
      summary: Add a component to a page
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentCreateRequest"
      responses:
        "201":
          description: Component created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentResponse"
        "404":
          description: Page not found
        "400":
          description: Invalid component data

  /courses/{courseId}/pages/{pageId}/components/reorder:
    post:
      tags: [Components]
      operationId: reorderComponents
      summary: Reorder components on a page
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orderedIds:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Components reordered
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComponentResponse"

  /courses/{courseId}/pages/{pageId}/components/{componentId}:
    get:
      tags: [Components]
      operationId: getComponent
      summary: Get component details
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: pageId
          in: path
          required: true
          schema:
            type: string
        - name: componentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Component details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentResponse"
        "404":
          description: Component not found

    patch:
      tags: [Components]
      operationId: updateComponent
      summary: Update component data
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: pageId
          in: path
          required: true
          schema:
            type: string
        - name: componentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentUpdateRequest"
      responses:
        "200":
          description: Component updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentResponse"
        "404":
          description: Component not found

    delete:
      tags: [Components]
      operationId: deleteComponent
      summary: Delete a component
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: pageId
          in: path
          required: true
          schema:
            type: string
        - name: componentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Component deleted
        "404":
          description: Component not found

  # ──────────────────────────────────────────
  # COMPONENTS REGISTRY
  # ──────────────────────────────────────────

  /components:
    get:
      tags: [ComponentRegistry]
      operationId: listComponentTypes
      summary: List all component types
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of component types
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentTypeListResponse"

  /components/categories:
    get:
      tags: [ComponentRegistry]
      operationId: listComponentCategories
      summary: List component categories
      responses:
        "200":
          description: List of categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"

  /components/categories/{categoryId}:
    get:
      tags: [ComponentRegistry]
      operationId: getComponentCategory
      summary: Get category details
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Category details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorySummary"
        "404":
          description: Category not found

  /components/search:
    get:
      tags: [ComponentRegistry]
      operationId: searchComponentTypes
      summary: Search component types
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ComponentTypeSummary"

  /components/{typeId}:
    get:
      tags: [ComponentRegistry]
      operationId: getComponentType
      summary: Get component type details
      parameters:
        - name: typeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Component type details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComponentTypeDetail"
        "404":
          description: Component type not found

  # ──────────────────────────────────────────
  # THEMES
  # ──────────────────────────────────────────

  /themes:
    get:
      tags: [Themes]
      operationId: listThemes
      summary: List all themes
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of themes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ThemeResponse"

    post:
      tags: [Themes]
      operationId: createTheme
      summary: Create a new theme
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeCreateRequest"
      responses:
        "201":
          description: Theme created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeResponse"
        "400":
          description: Invalid theme data

  /themes/presets:
    get:
      tags: [Themes]
      operationId: listPresetThemes
      summary: List preset themes
      responses:
        "200":
          description: List of preset themes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ThemeResponse"

  /themes/{themeId}:
    get:
      tags: [Themes]
      operationId: getTheme
      summary: Get theme details
      parameters:
        - name: themeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Theme details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeResponse"
        "404":
          description: Theme not found

    patch:
      tags: [Themes]
      operationId: updateTheme
      summary: Update theme
      parameters:
        - name: themeId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThemeUpdateRequest"
      responses:
        "200":
          description: Theme updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ThemeResponse"
        "404":
          description: Theme not found

    delete:
      tags: [Themes]
      operationId: deleteTheme
      summary: Delete a theme
      parameters:
        - name: themeId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Theme deleted
        "404":
          description: Theme not found

  /courses/{courseId}/theme:
    get:
      tags: [Themes]
      operationId: getCourseTheme
      summary: Get course theme
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resolved theme (inherited + overrides)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedThemeResponse"
        "404":
          description: Course not found

    patch:
      tags: [Themes]
      operationId: setCourseTheme
      summary: Set or update course theme
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseThemeRequest"
      responses:
        "200":
          description: Theme updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedThemeResponse"
        "404":
          description: Course not found

  /courses/{courseId}/pages/{pageId}/theme:
    get:
      tags: [Themes]
      operationId: getPageTheme
      summary: Get page theme (inherited or page-specific)
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resolved theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedThemeResponse"
        "404":
          description: Page not found

    patch:
      tags: [Themes]
      operationId: setPageTheme
      summary: Set or update page theme
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseThemeRequest"
      responses:
        "200":
          description: Theme updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedThemeResponse"
        "404":
          description: Page not found

  # ──────────────────────────────────────────
  # SCORING & COMPLETION
  # ──────────────────────────────────────────

  /courses/{courseId}/scoring:
    get:
      tags: [Scoring]
      operationId: getScoringConfig
      summary: Get scoring configuration
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Scoring configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoringConfigResponse"
        "404":
          description: Course not found

    patch:
      tags: [Scoring]
      operationId: updateScoringConfig
      summary: Update scoring configuration
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoringConfigUpdateRequest"
      responses:
        "200":
          description: Scoring configuration updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoringConfigResponse"
        "404":
          description: Course not found

  /courses/{courseId}/scoring/validate:
    post:
      tags: [Scoring]
      operationId: validateScoringConfig
      summary: Validate scoring configuration
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  errors:
                    type: array
                    items:
                      type: string
        "404":
          description: Course not found

  /courses/{courseId}/scoring/calculate:
    post:
      tags: [Scoring]
      operationId: calculateScore
      summary: Calculate score for submission
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScoreCalculateRequest"
      responses:
        "200":
          description: Score calculation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScoreCalculateResponse"
        "400":
          description: Invalid answer data
        "404":
          description: Course not found

  /courses/{courseId}/completion:
    get:
      tags: [Completion]
      operationId: getCourseCompletion
      summary: Get course completion status
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Course completion status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseCompletionResponse"
        "404":
          description: Course not found

  /courses/{courseId}/pages/{pageId}/completion:
    get:
      tags: [Completion]
      operationId: getPageCompletion
      summary: Get page completion status
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Page completion status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageCompletionResponse"
        "404":
          description: Page not found

    post:
      tags: [Completion]
      operationId: updatePageCompletion
      summary: Record page completion
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: pageId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageCompletionEvent"
      responses:
        "200":
          description: Completion recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageCompletionResponse"
        "404":
          description: Page not found

  /courses/{courseId}/interactions:
    post:
      tags: [Completion]
      operationId: recordInteraction
      summary: Record learner interaction
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InteractionEvent"
      responses:
        "201":
          description: Interaction recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InteractionEventResponse"
        "404":
          description: Course not found

    get:
      tags: [Completion]
      operationId: listInteractions
      summary: Get interaction history
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Interaction history
          content:
